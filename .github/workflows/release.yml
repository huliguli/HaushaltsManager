name: Build and Release

# On a published release, build BOTH platforms from the same source (100% parity):
#   * macOS   -> ad-hoc-signed HaushaltsManager.app packed into a .dmg
#   * Windows -> onedir app wrapped into a signed Inno Setup installer (.exe)
# Each attaches its binary + a matching .sha256; the in-app updater downloads the
# asset for the running platform, verifies the .sha256 and applies it.
#
# build-windows runs AFTER build-macos on purpose: it uploads its assets last, so
# the Windows ".exe.sha256" stays the last .sha256 in the release. Older Windows
# clients (<= 2.3.0) pick the last .sha256, so this keeps their auto-update working
# even now that a macOS .dmg + .dmg.sha256 are attached to the same release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Version prüfen (Release-Tag == version.json)
        if: github.event_name == 'release'
        run: |
          ver=$(python3 -c "import json;print(json.load(open('version.json'))['version'])")
          tag="${{ github.event.release.tag_name }}"; tag="${tag#v}"
          if [ "$ver" != "$tag" ]; then
            echo "version.json ($ver) passt nicht zum Release-Tag ($tag) - bitte version.json anheben."; exit 1
          fi
          echo "Version ok: $ver"

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests ausführen
        run: python -m pytest -q

      - name: App-Icon (.icns) erzeugen
        run: |
          python tools/make_icns.py
          iconutil -c icns -o assets/app.icns build/AppIcon.iconset

      - name: Anwendung bauen (.app)
        run: python -m PyInstaller --noconfirm --clean HaushaltsManager.spec

      - name: Ad-hoc signieren
        run: |
          codesign --force --deep --sign - dist/HaushaltsManager.app
          codesign --verify --deep --strict dist/HaushaltsManager.app || echo "codesign verify: Hinweis (ad-hoc)"

      - name: Headless-Smoke (gebautes Bundle startet + rendert)
        run: |
          export QT_QPA_PLATFORM=offscreen
          export HM_SMOKE=1 HM_VIEW=0 HM_THEME=light HM_SHOT="$RUNNER_TEMP/smoke.png"
          dist/HaushaltsManager.app/Contents/MacOS/HaushaltsManager
          test -f "$RUNNER_TEMP/smoke.png" || { echo "Smoke-Screenshot fehlt - Bundle defekt"; exit 1; }
          echo "Smoke ok"

      - name: Installer (.dmg) erstellen
        run: |
          rm -rf dist/dmg && mkdir -p dist/dmg
          cp -R dist/HaushaltsManager.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "HaushaltsManager" -srcfolder dist/dmg \
            -ov -format UDZO dist/HaushaltsManager-macOS.dmg

      - name: SHA-256 (über das .dmg)
        run: |
          shasum -a 256 dist/HaushaltsManager-macOS.dmg | awk '{print $1}' \
            | tr -d '\n' > dist/HaushaltsManager-macOS.dmg.sha256

      - name: Release-Assets hochladen (macOS)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HaushaltsManager-macOS.dmg
            dist/HaushaltsManager-macOS.dmg.sha256

      - name: Build-Artefakt hochladen (macOS, manuelle Läufe)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: HaushaltsManager-macOS
          path: |
            dist/HaushaltsManager-macOS.dmg
            dist/HaushaltsManager-macOS.dmg.sha256

  build-windows:
    needs: build-macos
    runs-on: windows-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      # Guard against a forgotten version bump: the installed app reads its own
      # version from the bundled version.json, so if the release tag is newer than
      # version.json the updater would offer the same update forever (a loop).
      - name: Version prüfen (Release-Tag == version.json)
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $ver = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.event.release.tag_name }}" -replace '^v', ''
          if ($ver -ne $tag) {
            Write-Error "version.json ($ver) passt nicht zum Release-Tag ($tag) - bitte version.json anheben."
            exit 1
          }
          Write-Host "Version ok: $ver"

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests ausführen
        run: python -m pytest -q

      - name: Anwendung bauen (onedir)
        run: python -m PyInstaller --noconfirm --clean HaushaltsManager.spec

      - name: Zertifikat vorbereiten (falls hinterlegt)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.CODESIGN_PFX_BASE64 }}
        run: |
          if ($env:PFX_B64) { [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:PFX_B64)) }
          else { Write-Host "Kein Signatur-Zertifikat hinterlegt." }

      - name: Inneres Programm signieren
        shell: pwsh
        env:
          PFX_PW: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          if (-not (Test-Path cert.pfx)) { Write-Host "ueberspringe"; exit 0 }
          $ok = $true
          try { ./sign.ps1 -File dist\HaushaltsManager\HaushaltsManager.exe -Pfx cert.pfx -Password $env:PFX_PW }
          catch { $ok = $false; Write-Host "Signieren fehlgeschlagen: $_" }
          if (-not $ok) { exit 1 }
          exit 0

      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $ver = (Get-Content version.json -Raw | ConvertFrom-Json).version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer\HaushaltsManager.iss

      - name: Installer signieren (falls Zertifikat hinterlegt)
        shell: pwsh
        env:
          PFX_PW: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          if (-not (Test-Path cert.pfx)) { Write-Host "ueberspringe"; exit 0 }
          $ok = $true
          try { ./sign.ps1 -File dist\HaushaltsManager-Setup.exe -Pfx cert.pfx -Password $env:PFX_PW }
          catch { $ok = $false; Write-Host "Signieren fehlgeschlagen: $_" }
          if (-not $ok) { exit 1 }
          exit 0

      - name: Aufräumen + SHA-256 (über die signierte Datei)
        shell: pwsh
        run: |
          Remove-Item cert.pfx -Force -ErrorAction SilentlyContinue
          (Get-FileHash dist\HaushaltsManager-Setup.exe -Algorithm SHA256).Hash.ToLower() |
            Set-Content -NoNewline dist\HaushaltsManager-Setup.exe.sha256

      - name: Release-Assets hochladen
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HaushaltsManager-Setup.exe
            dist/HaushaltsManager-Setup.exe.sha256

      - name: Build-Artefakt hochladen (manuelle Läufe)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: HaushaltsManager-Setup
          path: |
            dist/HaushaltsManager-Setup.exe
            dist/HaushaltsManager-Setup.exe.sha256
